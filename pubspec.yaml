name: liquid_glass_ui_kit
description: >-
  An accessible, customizable Liquid Glass design system for Flutter with
  translucent themes and ready-made widgets for mobile, web, and desktop.
version: 0.1.1
homepage: https://github.com/congfandi/liquid_glass_ui_kit
repository: https://github.com/congfandi/liquid_glass_ui_kit
issue_tracker: https://github.com/congfandi/liquid_glass_ui_kit/issues
screenshots:
  - description: Liquid Glass UI components running in the Flutter example app.
    path: example.gif
topics:
  - ui
  - theme
  - glassmorphism
  - ios
  - cupertino

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
